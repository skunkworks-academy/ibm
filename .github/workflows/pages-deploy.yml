name: Publish IBM Training to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibm-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and stage IBM Training site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CLA96G dependencies
        working-directory: db2/cla96
        run: npm install --no-audit --no-fund

      - name: Typecheck CLA96G
        working-directory: db2/cla96
        run: npm run typecheck

      - name: Build CLA96G
        working-directory: db2/cla96
        run: npm run build

      - name: Validate CLA96G SEO
        working-directory: db2/cla96
        run: npm run seo:check

      - name: Install ZBSEC1 dependencies
        working-directory: db2/zbsec1
        run: npm install --no-audit --no-fund

      - name: Typecheck ZBSEC1
        working-directory: db2/zbsec1
        run: npm run typecheck

      - name: Build ZBSEC1
        working-directory: db2/zbsec1
        run: npm run build

      - name: Validate ZBSEC1 SEO
        working-directory: db2/zbsec1
        run: npm run seo:check

      - name: Stage complete IBM site with the shared design
        run: python3 scripts/stage-ibm-site.py --output _site

      - name: Install and verify Academy search favicons
        uses: skunkworks-academy/www/.github/actions/search-favicons@67c4ab0d8f7c5dca50d54b8dad24174b0e41a39a
        with:
          artifact-path: "_site"
      - name: Verify every IBM route and theme asset
        run: python3 scripts/check-ibm-site.py _site

      - name: Resolve reviewed Academy shell fixture
        id: reference
        run: |
          python3 - <<'PYREF'
          import json, os, re
          with open('assets/ibm-reference.json') as source:
              commit = json.load(source)['sourceCommit']
          if not re.fullmatch(r'[a-f0-9]{40}', commit):
              raise SystemExit('An immutable Academy reference commit is required.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\n')
          PYREF

      - name: Checkout reviewed Academy shell assets
        uses: actions/checkout@v4
        with:
          repository: skunkworks-academy/www
          ref: ${{ steps.reference.outputs.commit }}
          path: _reference-www
          sparse-checkout: |
            assets
            images

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for release checks
        run: npx playwright install --with-deps chromium

      - name: Test IBM desktop, tablet, mobile and theme workflows
        run: npm run test:browser

      - name: Upload IBM screenshots and accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibm-browser-evidence
          path: test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Upload reviewed design preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ibm-design-preview
          path: _site
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy IBM Training site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout release verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify shared design on every public IBM route
        run: python3 scripts/verify-ibm-live.py --commit "${GITHUB_SHA}"

      - name: Record successful Pages verification
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit deployment verification marker
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p .github/deployment-status
          cat > .github/deployment-status/zbsec1-pages.txt <<EOF
          IBM shared-design GitHub Pages deployment verified.
          Source workflow SHA: ${GITHUB_SHA}
          GitHub Pages URL: ${PAGE_URL}
          Public URL: https://ibm.skunkworksacademy.com/db2/zbsec1/
          Verified by: actions/deploy-pages + release SHA + all public routes + shared CSS
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/zbsec1-pages.txt
          if git diff --cached --quiet; then
            echo 'Deployment verification marker is already current.'
          else
            git commit -m 'Record verified ZBSEC1 Pages deployment [skip ci]'
            git push origin HEAD:main
          fi

  diagnostics:
    name: Record Pages workflow result
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write workflow result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          mkdir -p .github/deployment-status
          cat > .github/deployment-status/zbsec1-pages-status.txt <<EOF
          ZBSEC1 Pages workflow status
          Source workflow SHA: ${GITHUB_SHA}
          Build result: ${BUILD_RESULT}
          Deploy result: ${DEPLOY_RESULT}
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/zbsec1-pages-status.txt
          if git diff --cached --quiet; then
            echo 'Workflow status marker unchanged.'
          else
            git commit -m 'Record ZBSEC1 Pages workflow status [skip ci]'
            git push origin HEAD:main
          fi
