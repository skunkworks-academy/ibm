name: ZBSEC1 Docusaurus Quality

on:
  push:
    branches:
      - main
      - 'course/**'
    paths:
      - 'db2/zbsec1/**'
      - '.github/workflows/zbsec1-ci-deploy.yml'
  pull_request:
    paths:
      - 'db2/zbsec1/**'
      - '.github/workflows/zbsec1-ci-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbsec1-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build and SEO validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: db2/zbsec1
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: db2/zbsec1
        run: npm run typecheck

      - name: Build Docusaurus course
        working-directory: db2/zbsec1
        run: npm run build

      - name: Validate generated SEO metadata
        working-directory: db2/zbsec1
        run: npm run seo:check

# Publication is intentionally handled by pages-deploy.yml.
# That workflow stages the complete IBM Training site, overlays a fresh ZBSEC1
# production build, uploads a GitHub Pages artifact, and deploys it with
# actions/deploy-pages. Keeping publication separate prevents generated-file
# commits, workflow recursion, and stale branch-based Pages builds.
