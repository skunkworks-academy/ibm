name: Publish IBM Training to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and stage IBM Training site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ZBSEC1 dependencies
        working-directory: db2/zbsec1
        run: npm install --no-audit --no-fund

      - name: Typecheck ZBSEC1
        working-directory: db2/zbsec1
        run: npm run typecheck

      - name: Build ZBSEC1
        working-directory: db2/zbsec1
        run: npm run build

      - name: Validate ZBSEC1 SEO
        working-directory: db2/zbsec1
        run: npm run seo:check

      - name: Stage complete IBM static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='**/node_modules/' \
            --exclude='db2/zbsec1/build/' \
            --exclude='db2/cla96/build/'

          mkdir -p _site/db2/zbsec1
          rm -rf _site/db2/zbsec1/assets \
                 _site/db2/zbsec1/course \
                 _site/db2/zbsec1/img \
                 _site/db2/zbsec1/labs \
                 _site/db2/zbsec1/index.html \
                 _site/db2/zbsec1/404.html \
                 _site/db2/zbsec1/robots.txt \
                 _site/db2/zbsec1/sitemap.xml \
                 _site/db2/zbsec1/.nojekyll
          cp -a db2/zbsec1/build/. _site/db2/zbsec1/

          touch _site/.nojekyll
          test -f _site/CNAME
          test -f _site/index.html
          test -f _site/db2/zbsec1/index.html
          find _site/db2/zbsec1/assets/js -maxdepth 1 -name 'main.*.js' -print -quit | grep -q .
          grep -q 'ZBSEC1' _site/db2/zbsec1/index.html
          grep -q 'Db2 for z/OS banking security, end to end' _site/db2/zbsec1/index.html

      - name: Enforce Academy global shell on every staged HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          loader = f'<script defer src="{current}" {marker}></script>'
          old_tags = re.compile(r'<script\b[^>]*(?:academy-navigation\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I)
          pages = list(Path('_site').rglob('*.html'))
          documents = []

          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if not re.search(r'<!doctype\s+html|<html\b|<head\b|<body\b', html, re.I):
                  continue
              html = old_tags.sub('', html)
              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'{loader}</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'{loader}</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Malformed HTML document cannot receive Academy shell: {path}')
              path.write_text(html, encoding='utf-8')
              documents.append(path)

          if not documents:
              raise SystemExit('IBM staging produced no HTML documents.')

          missing = []
          duplicate = []
          for path in documents:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if current not in html or marker not in html:
                  missing.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicate.append(str(path))

          if missing:
              raise SystemExit('Global shell missing from: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate global shell loaders in: ' + ', '.join(duplicate))

          print(f'Verified Academy canonical v10 shell on {len(documents)} IBM HTML document(s).')
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy IBM Training site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify ZBSEC1 on public custom domain
        shell: bash
        run: |
          set -euo pipefail
          url='https://ibm.skunkworksacademy.com/db2/zbsec1/'
          body="${RUNNER_TEMP}/zbsec1-public.html"

          for attempt in $(seq 1 18); do
            echo "Verification attempt ${attempt}/18: ${url}"
            status=$(curl -L -sS --connect-timeout 10 --max-time 30 \
              -o "${body}" -w '%{http_code}' "${url}" || true)

            if [ "${status}" = '200' ] && \
               grep -q 'Db2 for z/OS banking security, end to end' "${body}"; then
              echo 'ZBSEC1 public route verified successfully.'
              exit 0
            fi

            echo "Public route not ready yet (HTTP ${status})."
            sleep 10
          done

          echo 'ZBSEC1 did not become available on the public custom domain.' >&2
          if [ -f "${body}" ]; then
            head -c 2000 "${body}" >&2 || true
          fi
          exit 1

      - name: Record successful Pages verification
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit deployment verification marker
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p .github/deployment-status
          cat > .github/deployment-status/zbsec1-pages.txt <<EOF
          ZBSEC1 GitHub Pages deployment verified.
          Source workflow SHA: ${GITHUB_SHA}
          GitHub Pages URL: ${PAGE_URL}
          Public URL: https://ibm.skunkworksacademy.com/db2/zbsec1/
          Verified by: actions/deploy-pages + public HTTP content check
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/zbsec1-pages.txt
          if git diff --cached --quiet; then
            echo 'Deployment verification marker is already current.'
          else
            git commit -m 'Record verified ZBSEC1 Pages deployment [skip ci]'
            git push origin HEAD:main
          fi

  diagnostics:
    name: Record Pages workflow result
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write workflow result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          mkdir -p .github/deployment-status
          cat > .github/deployment-status/zbsec1-pages-status.txt <<EOF
          ZBSEC1 Pages workflow status
          Source workflow SHA: ${GITHUB_SHA}
          Build result: ${BUILD_RESULT}
          Deploy result: ${DEPLOY_RESULT}
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/zbsec1-pages-status.txt
          if git diff --cached --quiet; then
            echo 'Workflow status marker unchanged.'
          else
            git commit -m 'Record ZBSEC1 Pages workflow status [skip ci]'
            git push origin HEAD:main
          fi
